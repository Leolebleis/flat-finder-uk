{% extends "base.html" %}
{% block title %}Map - Flat Finder{% endblock %}
{% block head %}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
    html, body { margin: 0; padding: 0; height: 100%; }
    #map { width: 100%; height: calc(100vh - 40px); }

    .map-filters {
        position: absolute;
        top: 50px;
        right: 10px;
        z-index: 1000;
        display: flex;
        gap: 4px;
    }
    .map-filters button {
        padding: 6px 12px;
        border: 1px solid #999;
        border-radius: 4px;
        background: #fff;
        cursor: pointer;
        font-size: 13px;
    }
    .map-filters button.active {
        background: #333;
        color: #fff;
        border-color: #333;
    }
</style>
{% endblock %}
{% block content %}
<div class="map-filters">
    <button id="filter-all" class="active" onclick="setFilter('all')">All</button>
    <button id="filter-unseen" onclick="setFilter('unseen')">Unseen</button>
    <button id="filter-favourites" onclick="setFilter('favourites')">Favourites</button>
</div>
<div id="map"></div>
<script src="{{ request.url_for('static', path='map.js') }}"></script>
{% endblock %}
