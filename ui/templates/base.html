<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flat Finder{% endblock %}</title>
    <link rel="icon" type="image/png" href="/flat/static/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/flat/static/v2.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="nav">
        <div class="nav__inner">
            <a class="nav__brand" href="{{ request.url_for('feed_page') }}">Flat Finder</a>
            <div class="nav__links">
                <a class="nav__link {% if '/listing' not in request.url.path %}nav__link--active{% endif %}"
                   href="{{ request.url_for('feed_page') }}">Feed</a>
                <a class="nav__link" href="{{ request.url_for('map_page') }}">Map</a>
                <a class="nav__link" href="{{ request.url_for('settings_page') }}">Settings</a>
            </div>
        </div>
    </nav>
    <main class="main">
        {% block content %}{% endblock %}
    </main>
    <script src="/flat/static/v2.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
