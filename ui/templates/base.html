<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flat Finder{% endblock %}</title>
    <link rel="icon" type="image/png" href="/flat/static/favicon.png">
    <link rel="stylesheet" href="/flat/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <span class="navbar__brand">Flat Finder</span>
        <ul class="navbar__links">
            <li>
                <a class="navbar__link {% if request.url.path == '/flat/' or request.url.path == '/flat' %}navbar__link--active{% endif %}"
                   href="{{ request.url_for('feed_page') }}">Feed</a>
            </li>
            <li>
                <a class="navbar__link {% if '/map' in request.url.path %}navbar__link--active{% endif %}"
                   href="{{ request.url_for('map_page') }}">Map</a>
            </li>
        </ul>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/flat/static/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
