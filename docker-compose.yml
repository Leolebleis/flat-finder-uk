services:
  flat-finder:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: flat-finder
    restart: unless-stopped
    volumes:
      - flat-finder-data:/app/data
    environment:
      - FLAT_FINDER_DB=/app/data/flat_finder.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    networks:
      - default
      - pi-net

  flat-finder-scraper:
    build:
      context: .
      dockerfile: Dockerfile.scraper
    container_name: flat-finder-scraper
    restart: unless-stopped
    volumes:
      - flat-finder-data:/app/data
    environment:
      - FLAT_FINDER_DB=/app/data/flat_finder.db
      - GMAIL_ADDRESS=${GMAIL_ADDRESS:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}

volumes:
  flat-finder-data:

networks:
  pi-net:
    external: true
