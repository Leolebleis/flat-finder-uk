services:
  flat-finder:
    build:
      context: .
      target: ui
    container_name: flat-finder
    restart: unless-stopped
    volumes:
      - flat-finder-data:/app/data
    environment:
      - FLAT_FINDER_DB=/app/data/flat_finder.db
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
    networks:
      - default
      - pi-net

  flat-finder-scraper:
    build:
      context: .
      target: scraper
    container_name: flat-finder-scraper
    restart: unless-stopped
    volumes:
      - flat-finder-data:/app/data
    environment:
      - FLAT_FINDER_DB=/app/data/flat_finder.db
      - GMAIL_ADDRESS=${GMAIL_ADDRESS:-}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD:-}
      # MCP endpoint of a scrapling container reachable on pi-net, e.g.
      # http://gluetun:8001/mcp (set in .env); empty = fetch directly
      - SCRAPLING_MCP_URL=${SCRAPLING_MCP_URL:-}
    networks:
      - default
      - pi-net

volumes:
  flat-finder-data:

networks:
  pi-net:
    external: true
