[project]
name = "flat-finder"
version = "0.1.0"
description = "Property alert system: Rightmove + OpenRent scraper with FastAPI UI"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "requests>=2.31",
    "shapely>=2.0",
    "beautifulsoup4>=4.12",
    "sqlalchemy>=2.0",
    "alembic>=1.15",
    "itsdangerous>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "respx>=0.22",
    "pytest-mock>=3",
    "polyfactory>=2",
    "pytest-cov>=6",
    "dirty-equals>=0.8",
    "ruff>=0.11",
    "ty>=0.0.20",
    "asgi-lifespan>=2.1",
    "httpx>=0.28",
    "import-linter>=2.11",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["flat_finder", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",
    "COM812",
    "ISC001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "S104", "S106"]
"alembic/*.py" = ["INP001"]
"alembic/versions/*.py" = ["INP001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["flat_finder"]

[tool.coverage.report]
show_missing = true
fail_under = 75

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flat_finder"]
exclude = ["**/Dockerfile", "**/requirements.txt"]

[tool.importlinter]
root_packages = ["flat_finder"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain models do not import infrastructure"
type = "forbidden"
source_modules = [
    "flat_finder.listings.model",
    "flat_finder.listings.dao",
    "flat_finder.zones.model",
    "flat_finder.zones.dao",
    "flat_finder.pois.model",
    "flat_finder.pois.dao",
    "flat_finder.users.model",
    "flat_finder.users.dao",
]
forbidden_modules = [
    "flat_finder.api",
    "flat_finder.database",
    "sqlalchemy",
]
